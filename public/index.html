<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NFL Playoff Fantasy</title>
  <link rel="stylesheet" href="/css/app.css" />
  <script>
    // Re-apply the cached theme before first paint (js/theme.js writes this)
    try {
      var tv = JSON.parse(localStorage.getItem('themeVars') || 'null');
      if (tv) for (var k in tv) document.documentElement.style.setProperty(k, tv[k]);
    } catch (e) {}
  </script>
  <style>
    /* ── Login page ── */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: radial-gradient(ellipse 80% 60% at 50% -20%, rgba(var(--gold-rgb),0.12) 0%, transparent 70%);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .login-logo {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, var(--gold), var(--gold-deep));
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 1.5rem;
    }
    .login-card h1 { margin-bottom: 6px; }
    .login-card > p { color: var(--text-2); font-size: 14px; margin-bottom: 1.5rem; }

    /* Auth tabs */
    .auth-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1.25rem; }
    .auth-tab {
      flex: 1; padding: 8px; font-size: 13px; font-weight: 500; font-family: var(--font);
      color: var(--text-2); background: none; border: none; border-bottom: 2px solid transparent;
      margin-bottom: -1px; cursor: pointer; transition: all .12s;
    }
    .auth-tab:hover { color: var(--text); }
    .auth-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

    .auth-panel { display: none; }
    .auth-panel.active { display: flex; flex-direction: column; gap: 10px; }

    .login-input {
      width: 100%; height: 42px; padding: 0 14px;
      background: var(--bg-raised); border: 1px solid var(--border-mid);
      border-radius: var(--radius-sm); color: var(--text); font-size: 14px;
      font-family: var(--font); outline: none; transition: border-color .12s; text-align: left;
    }
    .login-input:focus { border-color: var(--gold); }

    .login-btn {
      width: 100%; height: 44px; border-radius: var(--radius);
      background: var(--gold); color: var(--on-gold); border: none;
      font-size: 15px; font-weight: 600; font-family: var(--font); cursor: pointer;
      transition: background .1s;
    }
    .login-btn:hover { background: var(--gold-hover); }
    .login-btn:disabled { opacity: .5; cursor: not-allowed; }

    .auth-divider {
      display: flex; align-items: center; gap: 10px;
      font-size: 11px; color: var(--text-3); margin: 4px 0;
    }
    .auth-divider::before, .auth-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    .google-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; height: 44px;
      background: var(--bg-raised); color: var(--text);
      border: 1px solid var(--border-mid); border-radius: var(--radius);
      font-size: 14px; font-weight: 500; font-family: var(--font);
      cursor: pointer; transition: background .1s;
    }
    .google-btn:hover { background: var(--bg-hover); }
    .google-btn svg { width: 18px; height: 18px; }

    .auth-error {
      font-size: 12px; color: var(--red); background: var(--red-dim);
      border: 1px solid rgba(239,68,68,.25); border-radius: var(--radius-sm);
      padding: 8px 12px; display: none;
    }
    .auth-error.visible { display: block; }

    .login-footer {
      margin-top: 1.5rem; font-size: 12px; color: var(--text-3);
    }

    /* ── Home / Lobby ── */
    .hero {
      padding: 3rem 0 2rem;
      background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(var(--gold-rgb),0.08) 0%, transparent 60%);
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }
    .hero-inner { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }

    .league-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; margin-bottom: 3rem; }
    .league-card { display: flex; flex-direction: column; gap: 10px; }
    .league-card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
    .league-meta { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-2); }

    /* ── Standings / League detail ── */
    .standings-row {
      display: grid;
      grid-template-columns: 32px 1fr auto auto auto auto auto;
      align-items: center;
      gap: 0 10px;
      padding: 10px 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      transition: background 0.1s;
    }
    .standings-row:hover { background: var(--bg-raised); }
    .standings-row.header { font-size: 11px; font-weight: 600; color: var(--text-3); padding: 6px 1rem; }
    .nfl-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; }
    .nfl-h { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
    .sched-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 13px; }
    .live-mini { display: block; padding: 10px 12px; border: 1px solid var(--gold-border); background: var(--gold-dim); border-radius: var(--radius); margin-bottom: 8px; color: inherit; text-decoration: none; font-size: 13px; }
    .mono { font-family: var(--font-mono); }
    .x3 { font-size: 12px; color: var(--text-3); }
    .me { color: var(--gold); font-weight: 600; }
    .home-action { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border: 1px solid var(--gold-border); background: var(--gold-dim); border-radius: var(--radius-lg); margin-bottom: 12px; font-size: 13px; }
    .home-action.warn { border-color: var(--red); background: rgba(239,68,68,.08); }
    .home-stats { display: flex; gap: 18px; margin: 12px 0 10px; }
    .home-stats > div { flex: 1; min-width: 0; }
    .home-stats b { display: block; font-size: 24px; font-weight: 600; line-height: 1.2; }
    .home-stats small { font-size: 12px; color: var(--text-3); font-weight: 400; }
    .home-bar { height: 6px; border-radius: 3px; background: var(--bg-raised); overflow: hidden; }
    .home-bar i { display: block; height: 100%; background: var(--gold); }
    .home-tag { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--bg-raised); color: var(--text-2); font-family: var(--font-mono); }
    .home-lb { display: grid; grid-template-columns: 20px 1fr auto; gap: 4px 8px; font-size: 13px; }
    .live-score { display: flex; align-items: center; justify-content: space-around; text-align: center; margin: 14px 0 4px; }
    .live-score img { height: 44px; margin-bottom: 4px; }
    .live-score .n { font-size: 38px; font-weight: 700; font-family: var(--font-mono); line-height: 1.1; }
    .live-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
    .live-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; }
    .round-score { text-align: right; min-width: 44px; font-family: var(--font-mono); font-size: 12px; }

    .st-wrap { overflow-x: auto; }
    .st-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .st-table th { font-size: 11px; font-weight: 600; color: var(--text-3); text-align: right; padding: 8px 10px; white-space: nowrap; }
    .st-table td { padding: 10px; border-top: 1px solid var(--border); text-align: right; font-family: var(--font-mono); white-space: nowrap; }
    .st-table th.l, .st-table td.l { text-align: left; font-family: inherit; }
    .st-row { cursor: pointer; }
    .st-row:hover { background: var(--bg-raised); }
    .st-row.me { background: var(--gold-dim); }
    .st-best { color: var(--gold); font-weight: 700; }
    .st-sub { display: block; font-size: 10px; color: var(--text-3); font-weight: 400; }
    .st-detail td { padding: 0; background: var(--bg-raised); }
    .st-detail-in { padding: 8px 14px 12px; text-align: left; }
    .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 14px; }
    @media (max-width: 520px) { .grid-cards { grid-template-columns: 1fr; } }
    .rg { width: 100%; border-collapse: collapse; font-size: 12px; }
    .rg th { font-size: 10px; color: var(--text-3); font-weight: 600; text-align: right; padding: 4px 6px; }
    .rg td { padding: 4px 6px; border-top: 1px solid var(--border); text-align: right; font-family: var(--font-mono); }
    .rg th.l, .rg td.l { text-align: left; font-family: inherit; }
    .rg tr.dead td { opacity: .5; }
    .rg tr.dead .nm { text-decoration: line-through; }
    .rg tr.dead { background: repeating-linear-gradient(135deg, transparent 0 6px, rgba(255,255,255,.03) 6px 12px); }
    .tm-badge { display: inline-block; min-width: 34px; text-align: center; font-size: 10px; font-weight: 700; padding: 1px 5px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg-raised); }
    .done-tag { font-size: 9px; font-weight: 700; color: var(--red); border: 1px solid var(--red); border-radius: 4px; padding: 0 4px; white-space: nowrap; }
    .rg tfoot td { font-weight: 700; border-top: 2px solid var(--border); }
    .rg .z { color: var(--text-3); }

    /* ── Roster modal / section ── */
    .roster-player-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .roster-player-row:last-child { border-bottom: none; }

    /* ── Admin panel ── */
    .admin-section { margin-bottom: 2rem; }
    .admin-section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border);
    }
    .admin-table { width: 100%; border-collapse: collapse; }
    .admin-table td, .admin-table th {
      padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 13px; text-align: left;
    }
    .admin-table th { font-size: 11px; font-weight: 600; color: var(--text-3); }
  </style>
</head>
<body>

<!-- Global: toast container -->
<div id="toasts" class="toast-container"></div>

<!-- App root (all pages render here) -->
<div id="app"></div>


<script type="module">
  import { getSupabase, init, navigate, route, api, getMe, getSession, isAdmin, toast, signInWithGoogle, signOut, statusPill, posClass, fmt } from '/js/app.js';
  import { initDraft, destroyDraft } from '/js/draft.js';
  import { openThemePicker, maybeAskTheme } from '/js/themepicker.js';
  import { TEAMS } from '/js/theme.js';

  // Expose globally so inline onclick handlers can call them
  window.app = { signOut, navigate, openTheme: () => openThemePicker() };

  // ── Routes ──
  route('/login', renderLogin);
  route('/',      renderHome);
  route('/live',  renderLive);
  route('/join/:code', renderJoin);
  route('/league/:id', renderLeague);
  route('/league/:id/draft', renderDraftRoom);
  route('/admin', renderAdmin);

  // ── LOGIN ──
  function renderLogin() {
    const googleSvg = `<svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>`;

    document.getElementById('app').innerHTML = `
      <div class="login-wrap">
        <div class="login-card">
          <div class="login-logo">🏈</div>
          <h1>Playoff Fantasy</h1>
          <p>Pick your playoff roster, track your score, compete with your league.</p>

          <div class="auth-tabs">
            <button class="auth-tab active" data-auth-tab="signin">Sign in</button>
            <button class="auth-tab" data-auth-tab="signup">Create account</button>
          </div>

          <!-- Sign in panel -->
          <div class="auth-panel active" id="panel-signin">
            <div id="signin-error" class="auth-error"></div>
            <input class="login-input" id="signin-email" type="email" placeholder="Email address" autocomplete="email" />
            <input class="login-input" id="signin-password" type="password" placeholder="Password" autocomplete="current-password" />
            <button class="login-btn" id="signin-btn">Sign in</button>
            <button class="btn btn-ghost btn-sm" id="forgot-btn" style="width:100%;font-size:12px;">Forgot password?</button>
            <div class="auth-divider">or</div>
            <button class="google-btn" id="google-signin">${googleSvg} Continue with Google</button>
          </div>

          <!-- Sign up panel -->
          <div class="auth-panel" id="panel-signup">
            <div id="signup-error" class="auth-error"></div>
            <input class="login-input" id="signup-name" type="text" placeholder="Display name" autocomplete="name" />
            <input class="login-input" id="signup-email" type="email" placeholder="Email address" autocomplete="email" />
            <input class="login-input" id="signup-password" type="password" placeholder="Password (min 6 chars)" autocomplete="new-password" />
            <select class="login-input" id="signup-team">
              <option value="nfl">No favorite team (NFL colors)</option>
              ${[...TEAMS].sort((a, b) => a.name.localeCompare(b.name)).map(t => `<option value="${t.id}">${t.name}</option>`).join('')}
            </select>
            <button class="login-btn" id="signup-btn">Create account</button>
            <div class="auth-divider">or</div>
            <button class="google-btn" id="google-signup">${googleSvg} Continue with Google</button>
          </div>

          <p class="login-footer">By signing in you agree to play fair 🏆</p>
        </div>
      </div>
    `;

    // Tab switching
    document.querySelectorAll('[data-auth-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-auth-tab]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.authTab;
        document.getElementById('panel-signin').classList.toggle('active', tab === 'signin');
        document.getElementById('panel-signup').classList.toggle('active', tab === 'signup');
      });
    });

    // Sign in
    document.getElementById('signin-btn').addEventListener('click', async () => {
      const email = document.getElementById('signin-email').value.trim();
      const password = document.getElementById('signin-password').value;
      const errEl = document.getElementById('signin-error');
      errEl.classList.remove('visible');
      if (!email || !password) { errEl.textContent = 'Email and password required.'; errEl.classList.add('visible'); return; }
      const btn = document.getElementById('signin-btn');
      btn.disabled = true; btn.textContent = 'Signing in…';
      const { error } = await getSupabase().auth.signInWithPassword({ email, password });
      btn.disabled = false; btn.textContent = 'Sign in';
      if (error) { errEl.textContent = error.message; errEl.classList.add('visible'); }
    });

    // Sign up
    document.getElementById('signup-btn').addEventListener('click', async () => {
      const name = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const errEl = document.getElementById('signup-error');
      errEl.classList.remove('visible');
      if (!name || !email || !password) { errEl.textContent = 'All fields required.'; errEl.classList.add('visible'); return; }
      if (password.length < 6) { errEl.textContent = 'Password must be at least 6 characters.'; errEl.classList.add('visible'); return; }
      const btn = document.getElementById('signup-btn');
      btn.disabled = true; btn.textContent = 'Creating account…';
      const { error } = await getSupabase().auth.signUp({ email, password, options: { data: { display_name: name, theme: document.getElementById('signup-team').value } } });
      btn.disabled = false; btn.textContent = 'Create account';
      if (error) { errEl.textContent = error.message; errEl.classList.add('visible'); return; }
      // On success Supabase fires onAuthStateChange → navigates to /
      errEl.style.color = 'var(--green)'; errEl.textContent = 'Check your email to confirm your account.'; errEl.classList.add('visible');
    });

    // Forgot password
    document.getElementById('forgot-btn').addEventListener('click', async () => {
      const email = document.getElementById('signin-email').value.trim();
      if (!email) { const e = document.getElementById('signin-error'); e.textContent = 'Enter your email first.'; e.classList.add('visible'); return; }
      await getSupabase().auth.resetPasswordForEmail(email, { redirectTo: location.origin });
      toast('Password reset email sent', 'success');
    });

    // Google
    document.getElementById('google-signin').addEventListener('click', signInWithGoogle);
    document.getElementById('google-signup').addEventListener('click', signInWithGoogle);
  }

  // ── HOME ──
  const untilText = iso => {
    const ms = Date.parse(iso) - Date.now();
    if (ms <= 0) return 'now';
    const m = Math.floor(ms / 60000), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60);
    return d ? `${d}d ${h}h` : h ? `${h}h ${m % 60}m` : `${m}m`;
  };
  const whenText = iso => new Date(iso).toLocaleString(undefined, { weekday: 'long', hour: 'numeric', minute: '2-digit' });

  const kickText = iso => new Date(iso).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const gameRow = (g, showScore) => {
    const t = (x, bold) => `<span style="display:inline-flex;align-items:center;gap:6px;${bold ? 'font-weight:600;' : ''}"><img src="${esc(x.logo || '')}" alt="" style="height:18px;width:18px;object-fit:contain;" onerror="this.style.display='none'">${esc(x.name || 'TBD')}</span>`;
    const post = /post|wild|divis|conf|super/i.test(g.stage);
    const aWin = showScore && g.away.score > g.home.score, hWin = showScore && g.home.score > g.away.score;
    return `<div class="sched-row">
      <div style="min-width:0;display:flex;flex-direction:column;gap:3px;">${t(g.away, aWin)}${t(g.home, hWin)}</div>
      <div style="text-align:right;white-space:nowrap;">
        ${showScore ? `<div style="font-family:var(--font-mono);font-size:13px;line-height:1.55;"><span style="${aWin ? 'font-weight:700;' : ''}">${g.away.score}</span><br><span style="${hWin ? 'font-weight:700;' : ''}">${g.home.score}</span></div>`
          : `<div style="font-size:12px;">${kickText(g.kickoff)}</div><div class="x3">in ${untilText(g.kickoff)}</div>`}
        <div class="x3">${post ? '<b style="color:var(--gold);">PLAYOFFS</b> · ' : ''}${esc(g.week || g.stage)}</div>
      </div></div>`;
  };

  // "NFL Playoffs" panel under the greeting: what's live now, what's next, what just finished
  async function renderNflPanel() {
    const el = document.getElementById('nfl-panel');
    if (!el) return;
    const [live, sched] = await Promise.all([api('GET', '/live').catch(() => null), api('GET', '/live/schedule').catch(() => null)]);
    if (location.pathname !== '/' || !document.getElementById('nfl-panel')) return;
    if (!live && !sched) { el.innerHTML = ''; return; }

    const liveGames = live?.games || [];
    const liveHtml = liveGames.length ? `
      <div>
        <div class="nfl-h"><span class="pill pill-live"><span class="pill-dot pulse"></span>Live now</span></div>
        ${liveGames.map(g => {
          const mine = g.leagues.flatMap(l => l.members.filter(m => m.isMe));
          const pts = mine.reduce((a, m) => a + m.total, 0), n = mine.reduce((a, m) => a + m.players.length, 0);
          return `<a href="/live" data-link class="live-mini">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
              <span>${esc(g.away.name)} <b class="mono">${g.away.score}</b></span>
              <span class="x3">${esc(g.status.long || g.status.short)}${g.status.timer ? ' ' + esc(g.status.timer) : ''}</span>
              <span><b class="mono">${g.home.score}</b> ${esc(g.home.name)}</span>
            </div>
            <div class="x3" style="margin-top:6px;">${n ? `Your ${n} player${n === 1 ? '' : 's'} here: <b style="color:var(--gold);">${fmt(pts)} pts</b>` : 'None of your players are in this game'} · open live view →</div>
          </a>`;
        }).join('')}
      </div>` : '';

    const up = sched?.upcoming || [];
    const upHtml = `<div><div class="nfl-h">Upcoming games</div>${up.length ? up.slice(0, 5).map(g => gameRow(g, false)).join('') : '<div class="x3">No upcoming games on the schedule.</div>'}</div>`;
    const rec = sched?.recent || [];
    const recHtml = rec.length ? `<div><div class="nfl-h">Recent results</div>${rec.slice(0, 4).map(g => gameRow(g, true)).join('')}</div>` : '';

    el.innerHTML = `<div class="card nfl-panel">
      <div class="flex items-center justify-between" style="margin-bottom:10px;"><h3>NFL this week</h3><a href="/live" data-link class="x3" style="color:var(--gold);">Full live view →</a></div>
      <div class="nfl-cols">${liveHtml}${upHtml}${recHtml}</div>
    </div>`;
  }

  async function renderHome() {
    if (!getSession()) return navigate('/login');
    destroyDraft();

    // Signed in after following an invite link → go finish joining
    const pendingJoin = localStorage.getItem('pendingJoin');
    if (pendingJoin) return navigate(`/join/${pendingJoin}`);
    maybeAskTheme();

    const first = (getMe()?.email || getSession().user.email || '').split('@')[0].split('+')[0];
    document.getElementById('app').innerHTML = `
      ${navbar()}
      <div class="hero">
        <div class="page hero-inner">
          <div>
            <h1>Welcome back, ${esc(first)}</h1>
            <p id="home-sub" style="color:var(--text-2);margin-top:4px;">NFL Playoffs</p>
          </div>
          <button class="btn btn-primary" id="create-league-btn">+ New League</button>
        </div>
      </div>
      <div class="page">
        <div id="nfl-panel" style="margin-bottom:12px;"></div>
        <div id="home-actions"></div>
        <div id="leagues-container"><div class="skeleton" style="height:160px;border-radius:var(--radius-lg);"></div></div>
      </div>
    `;
    document.getElementById('create-league-btn').addEventListener('click', () => showCreateLeagueModal());
    renderNflPanel();

    try {
      const home = await api('GET', '/home');
      if (location.pathname !== '/') return;
      const sub = document.getElementById('home-sub');
      if (sub && home.next) sub.textContent = `${home.next.round} round kicks off ${whenText(home.next.kickoff)} (in ${untilText(home.next.kickoff)})`;
      renderHomeActions(home.actions);
      renderLeagueGrid(home.leagues);
    } catch (e) {
      toast(e.message, 'error');
    }
  }

  function renderHomeActions(actions) {
    const el = document.getElementById('home-actions');
    if (!el || !actions?.length) return;
    el.innerHTML = actions.map(a => a.type === 'pick'
      ? `<div class="home-action"><div><b>It's your pick</b><div class="x3">${esc(a.leagueName)} · you're on the clock</div></div><a href="/league/${a.leagueId}/draft" data-link class="btn btn-primary btn-sm">Enter draft room</a></div>`
      : `<div class="home-action warn"><div><b>${esc(a.player)} (${esc(a.team)}) is ruled out</b><div class="x3">${esc(a.leagueName)} · swap him before kickoff in ${untilText(a.kickoff)}</div></div><a href="/league/${a.leagueId}" data-link class="btn btn-primary btn-sm" onclick="sessionStorage.setItem('openTab','roster')">Replace player</a></div>`
    ).join('');
  }

  const medalOf = r => r === 1 ? '🥇' : r === 2 ? '🥈' : r === 3 ? '🥉' : r;

  function leagueCardBody(l) {
    if (l.status === 'setup') {
      const need = Math.max(0, 7 - l.memberCount);
      return `
        <div class="x3" style="margin:10px 0;">${l.memberCount} of 7 players have joined${need ? ` · ${need} more needed` : ' · ready to draft'}</div>
        ${l.isCommissioner && l.inviteCode ? `<button class="btn btn-ghost btn-sm" data-copy-invite="${l.inviteCode}">Copy invite link</button>` : ''}`;
    }
    if (l.status === 'drafting' && l.draft) {
      const d = l.draft;
      return `
        <div style="margin:10px 0 6px;font-size:18px;font-weight:600;">${d.myTurn ? "You're on the clock" : 'Draft in progress'}</div>
        <div class="x3">Pick ${d.picksMade + 1} of ${d.total}${d.myTurn ? '' : d.upIn != null ? ` · you're up in ${d.upIn} pick${d.upIn === 1 ? '' : 's'}` : ''}</div>
        <div class="x3" style="margin-top:2px;">${d.clockRunning ? `${d.pickSeconds}s per pick` : 'Waiting for the commissioner to start the clock'}</div>
        <a href="/league/${l.id}/draft" data-link class="btn btn-primary btn-sm" style="margin-top:12px;" onclick="event.stopPropagation()">Enter draft room</a>`;
    }
    if (!l.me) {
      return l.top?.length ? `<div class="x3" style="margin-top:10px;">Leader: ${esc(l.leaderName)} · ${fmt(l.leaderTotal)}</div>` : '';
    }
    const m = l.me;
    const rounds = ['Wildcard', 'Divisional', 'Conference', 'Superbowl'];
    return `
      <div class="home-stats">
        <div><span class="x3">Rank</span><b>${medalOf(m.rank)}<small> of ${l.size}</small></b></div>
        <div><span class="x3">Points</span><b>${fmt(m.total)}</b></div>
        <div><span class="x3">${m.rank === 1 ? 'Lead' : 'Behind 1st'}</span><b style="color:${m.rank === 1 ? 'var(--green)' : 'var(--red)'};">${m.rank === 1 ? '🏆' : '−' + fmt(m.behind)}</b></div>
      </div>
      <div class="x3" style="display:flex;justify-content:space-between;margin-bottom:4px;"><span>Players still alive</span><span>${m.alive} of ${m.rosterSize || 14}</span></div>
      <div class="home-bar"><i style="width:${Math.round(100 * m.alive / (m.rosterSize || 14))}%"></i></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;">
        ${rounds.filter(r => l.started?.includes(r)).map(r => `<span class="home-tag">${r === 'Superbowl' ? 'SB' : r.slice(0, 3)} ${fmt(m.byRound[r])} (#${m.roundRank[r]})</span>`).join('')}
      </div>
      <div class="home-lb">
        ${l.top.map(t => `<span>${t.rank}</span><span class="${t.isMe ? 'me' : ''}">${esc(t.name)}${t.isMe ? ' (you)' : ''}</span><span class="${t.isMe ? 'me' : ''}">${fmt(t.total)}</span>`).join('')}
        ${m.rank > 3 ? `<span>${m.rank}</span><span class="me">You</span><span class="me">${fmt(m.total)}</span>` : ''}
      </div>
      ${m.bestPlayer ? `<div class="x3" style="margin-top:10px;">Your top player: ${esc(m.bestPlayer.name)} · ${fmt(m.bestPlayer.total)}</div>` : ''}`;
  }

  function renderLeagueGrid(leagues) {
    const el = document.getElementById('leagues-container');
    if (!el) return;
    if (!leagues.length) {
      el.innerHTML = `<div class="empty-state"><div class="icon">🏟️</div><p>No leagues yet. Create your own and invite 6 friends, or open an invite link from a friend to join theirs.</p></div>`;
      return;
    }
    el.innerHTML = `<div class="league-grid">${leagues.map(l => `
      <div class="card card-hover league-card" data-link onclick="app.navigate('/league/${l.id}')">
        <div class="flex items-center justify-between">
          <h3>${esc(l.name)}</h3>
          ${statusPill(l.status)}
        </div>
        <div class="x3">${l.season} season${l.isCommissioner ? ' · you run this league' : ''}</div>
        ${leagueCardBody(l)}
        <div class="league-card-footer"><span class="label">Open league →</span></div>
      </div>`).join('')}</div>`;
    el.querySelectorAll('[data-copy-invite]').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      navigator.clipboard?.writeText(`${location.origin}/join/${b.dataset.copyInvite}`);
      toast('Invite link copied', 'success');
    }));
  }

  // ── LIVE ──
  let liveTimer = null;
  let liveSelected = null;

  async function renderLive() {
    if (!getSession()) return navigate('/login');
    destroyDraft();
    clearInterval(liveTimer);
    document.getElementById('app').innerHTML = `
      ${navbar()}
      <div class="page" style="padding-top:1.5rem;">
        <div class="flex items-center justify-between mb-2"><h2>Live</h2><span class="x3" id="live-updated"></span></div>
        <div id="live-body"><div class="skeleton" style="height:160px;border-radius:var(--radius-lg);"></div></div>
        <div id="live-schedule" style="margin-top:12px;"></div>
      </div>`;
    loadSchedule();
    await loadLive();
    liveTimer = setInterval(() => {
      if (location.pathname !== '/live') { clearInterval(liveTimer); return; }
      loadLive();
    }, 15000);
  }

  async function loadSchedule() {
    try {
      const sched = await api('GET', '/live/schedule');
      const el = document.getElementById('live-schedule');
      if (!el || location.pathname !== '/live') return;
      el.innerHTML = `<div class="live-cols">
        <div class="card"><h3 style="margin-bottom:8px;">Upcoming schedule</h3>${sched.upcoming.length ? sched.upcoming.map(g => gameRow(g, false)).join('') : '<div class="x3">No upcoming games on the schedule.</div>'}</div>
        <div class="card"><h3 style="margin-bottom:8px;">Recent results</h3>${sched.recent.length ? sched.recent.map(g => gameRow(g, true)).join('') : '<div class="x3">No results yet.</div>'}</div>
      </div>`;
    } catch { /* schedule is optional */ }
  }

  async function loadLive() {
    try {
      const data = await api('GET', '/live');
      if (location.pathname !== '/live') return;
      paintLive(data);
    } catch (e) {
      const body = document.getElementById('live-body');
      if (body && !body.querySelector('.live-game')) body.innerHTML = `<div class="empty-state"><p>${esc(e.message)}</p></div>`;
    }
  }

  function paintLive(data) {
    const body = document.getElementById('live-body');
    if (!body) return;
    document.getElementById('live-updated').textContent = `Updated ${new Date(data.serverTime).toLocaleTimeString()}`;

    if (!data.games.length) {
      body.innerHTML = `<div class="card" style="text-align:center;padding:2rem 1rem;">
        <div style="font-size:36px;">🏈</div>
        <h3 style="margin:8px 0 4px;">No game is live right now</h3>
        ${data.next ? `<p class="x3">Next up: ${data.next.away ? esc(data.next.away) + ' at ' + esc(data.next.home) + ' · ' : ''}${esc(data.next.round)} round, ${whenText(data.next.kickoff)} (in ${untilText(data.next.kickoff)})</p>` : '<p class="x3">The next kickoff will show up here.</p>'}
      </div>`;
      return;
    }

    if (!data.games.some(g => g.id === liveSelected)) liveSelected = data.games[0].id;
    const g = data.games.find(x => x.id === liveSelected);
    const yours = g.leagues.flatMap(l => l.members.filter(m => m.isMe).map(m => ({ league: l.name, ...m })));

    body.innerHTML = `
      ${data.games.length > 1 ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">${data.games.map(x => `<button class="btn btn-sm ${x.id === g.id ? 'btn-primary' : 'btn-ghost'}" data-live-game="${x.id}">${esc(x.away.name)} @ ${esc(x.home.name)}</button>`).join('')}</div>` : ''}
      <div class="card live-game" style="margin-bottom:12px;">
        <div class="flex items-center justify-between">
          <span class="pill pill-live"><span class="pill-dot pulse"></span>LIVE · ${esc(g.status.long || g.status.short)}${g.status.timer ? ' ' + esc(g.status.timer) : ''}</span>
          <span class="x3">${esc(g.stage)} ${esc(g.week)}</span>
        </div>
        <div class="live-score">
          <div><img src="${esc(g.away.logo || '')}" alt="" onerror="this.style.display='none'"><div class="x3">${esc(g.away.name)}</div><div class="n">${g.away.score}</div></div>
          <div class="x3">at</div>
          <div><img src="${esc(g.home.logo || '')}" alt="" onerror="this.style.display='none'"><div class="x3">${esc(g.home.name)}</div><div class="n">${g.home.score}</div></div>
        </div>
      </div>
      <div class="live-cols">
        <div class="card">
          <h3 style="margin-bottom:2px;">Your fantasy points right now</h3>
          <div class="x3" style="margin-bottom:8px;">Running totals from this game (final when the game ends)</div>
          ${yours.length ? yours.map(y => `
            <div style="margin-bottom:10px;"><div class="x3" style="margin-bottom:4px;">${esc(y.league)}</div>
              ${y.players.map(p => `<div class="live-row"><span><span class="${posClass(p.position)}">${p.position}</span> ${esc(p.name)}</span><b>${fmt(p.points)}</b></div>`).join('')}
              <div class="live-row" style="border-top:1px solid var(--border);"><span class="x3">Total this game</span><b style="color:var(--gold);">${fmt(y.total)}</b></div>
            </div>`).join('') : '<div class="x3">None of your players are in this game.</div>'}
        </div>
        <div class="card">
          <h3 style="margin-bottom:8px;">Game leaders</h3>
          ${g.leaders.length ? g.leaders.map(p => `<div class="live-row"><span>${esc(p.name)} <span class="x3">${esc(p.team)}</span>${p.mine ? ' <span style="color:var(--gold);font-size:10px;">YOURS</span>' : ''}</span><b>${fmt(p.points)}</b></div>`).join('') : '<div class="x3">Stats appear once play gets going.</div>'}
        </div>
      </div>
      ${g.leagues.length ? `<div class="card" style="margin-top:12px;"><h3 style="margin-bottom:8px;">League impact</h3>
        ${g.leagues.map(l => `<div style="margin-bottom:10px;"><div class="x3" style="margin-bottom:4px;">${esc(l.name)}</div>
          ${l.members.map(m => `<div class="live-row"><span class="${m.isMe ? 'me' : ''}">${esc(m.name)}${m.isMe ? ' (you)' : ''} <span class="x3">${m.players.length} player${m.players.length === 1 ? '' : 's'} here</span></span><b>${fmt(m.total)}</b></div>`).join('')}</div>`).join('')}
      </div>` : ''}`;
    body.querySelectorAll('[data-live-game]').forEach(b => b.addEventListener('click', () => { liveSelected = b.dataset.liveGame; paintLive(data); }));
  }

  function showCreateLeagueModal() {
    const html = `
      <div id="modal-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;">
        <div class="card" style="width:100%;max-width:400px;">
          <div class="flex items-center justify-between mb-2">
            <h3>Create League</h3>
            <button class="btn btn-ghost btn-sm" id="close-modal">✕</button>
          </div>
          <div class="form-group">
            <label>League Name</label>
            <input type="text" id="new-league-name" placeholder="e.g. Friday Night League" />
          </div>
          ${isAdmin() ? `<div class="form-group">
            <label>Season (admin)</label>
            <select id="new-league-season">${seasonOptions().replace(' selected', '')}</select>
          </div>` : ''}
          <div class="form-group">
            <label>Time per pick</label>
            <select id="new-league-timer">
              <option value="30">30 seconds</option>
              <option value="60" selected>60 seconds</option>
              <option value="90">90 seconds</option>
            </select>
            <div style="font-size:12px;color:var(--text-3);margin-top:4px;">When the clock runs out, the best-ranked available player is drafted for you.</div>
          </div>
          <label style="display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text);margin:12px 0 4px;cursor:pointer;">
            <input type="checkbox" id="new-league-play" checked style="margin-top:3px;" />
            <span>I want to play in this league too
              <span style="display:block;font-size:12px;color:var(--text-3);">Leagues have exactly 7 players. If you play you're one of them (invite 6 more); if you only run it, invite 7.</span>
            </span>
          </label>
          <button class="btn btn-primary btn-full mt-2" id="submit-league">Create League</button>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML('beforeend', html);
    document.getElementById('close-modal').addEventListener('click', () => document.getElementById('modal-overlay')?.remove());
    document.getElementById('submit-league').addEventListener('click', async () => {
      const name   = document.getElementById('new-league-name').value.trim();
      const seasonEl = document.getElementById('new-league-season');
      const play = document.getElementById('new-league-play').checked;
      if (!name) return toast('Name required', 'error');
      try {
        const pick_seconds = parseInt(document.getElementById('new-league-timer').value);
        const league = await api('POST', '/leagues', { name, play, pick_seconds, ...(seasonEl ? { season: parseInt(seasonEl.value) } : {}) });
        document.getElementById('modal-overlay')?.remove();
        toast('League created! Share the invite link to fill it.', 'success');
        activeTab = 'manage';
        navigate(`/league/${league.id}`);
      } catch (e) { toast(e.message, 'error'); }
    });
  }

  // ── JOIN (invite link) ──
  async function renderJoin({ code }) {
    const app = document.getElementById('app');
    const signedIn = !!getSession();
    const shell = body => {
      app.innerHTML = `
        ${signedIn ? navbar() : `<nav class="navbar"><a class="navbar-brand" href="/" data-link><div class="navbar-logo">🏈</div><span class="navbar-title">Playoff <span>Fantasy</span></span></a></nav>`}
        <div class="page" style="max-width:460px;padding-top:3rem;"><div class="card" style="text-align:center;padding:2rem 1.5rem;">${body}</div></div>`;
    };
    shell('<div class="skeleton" style="height:120px;border-radius:var(--radius);"></div>');

    let info;
    try {
      const r = await fetch(`/api/leagues/invite/${encodeURIComponent(code)}`);
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'This invite link is not valid');
      info = await r.json();
    } catch (e) {
      localStorage.removeItem('pendingJoin');
      shell(`<div style="font-size:40px;">🤷</div><h2 style="margin:8px 0;">Invite not found</h2>
        <p style="color:var(--text-2);">${e.message}. Ask the league commissioner for a new link.</p>
        <a href="/" data-link class="btn btn-primary" style="margin-top:1rem;">Go home</a>`);
      return;
    }

    const closed = info.status !== 'setup' ? 'This league has already started its draft.'
      : info.members >= info.size ? 'This league is full.' : '';
    shell(`
      <div style="font-size:40px;">🏈</div>
      <h2 style="margin:8px 0 4px;">You're invited to ${info.name}</h2>
      <p style="color:var(--text-2);margin-bottom:4px;">${info.commissioner} is running this ${info.season} playoff league.</p>
      <p style="color:var(--text-3);font-size:13px;">${info.members} of ${info.size} players have joined</p>
      ${closed ? `<p style="color:var(--red);margin-top:1rem;">${closed}</p>` : `
        <button class="btn btn-primary btn-full" id="join-btn" style="margin-top:1.25rem;">${signedIn ? 'Join league' : 'Sign in to join'}</button>`}
      <a href="/" data-link id="join-skip" style="display:block;margin-top:1rem;font-size:13px;color:var(--text-3);">Not now</a>`);

    document.getElementById('join-skip')?.addEventListener('click', () => localStorage.removeItem('pendingJoin'));
    document.getElementById('join-btn')?.addEventListener('click', async () => {
      if (!signedIn) {
        localStorage.setItem('pendingJoin', code);
        return navigate('/login');
      }
      try {
        const r = await api('POST', '/leagues/join', { code });
        localStorage.removeItem('pendingJoin');
        toast(r.alreadyMember ? "You're already in this league" : `Welcome to ${info.name}!`, 'success');
        navigate(`/league/${r.id}`);
      } catch (e) { toast(e.message, 'error'); }
    });
  }

  // ── LEAGUE DETAIL ──
  let currentLeagueId = null;
  let activeTab = 'standings';
  const takeOpenTab = () => { const t = sessionStorage.getItem('openTab'); sessionStorage.removeItem('openTab'); return t; };

  async function renderLeague({ id }) {
    if (!getSession()) return navigate('/login');
    destroyDraft();
    currentLeagueId = id;
    { const t = takeOpenTab(); if (t) activeTab = t; }

    document.getElementById('app').innerHTML = `
      ${navbar()}
      <div class="page" style="padding-top:1.5rem;">
        <div id="league-header" class="mb-2">
          <div class="skeleton" style="height:60px;border-radius:var(--radius);"></div>
        </div>
        <div class="tabs mb-3" id="league-tabs">
          <button class="tab active" data-tab="standings">Standings</button>
          <button class="tab" data-tab="grid">All Rosters</button>
          <button class="tab" data-tab="roster">My Roster</button>
          <button class="tab" data-tab="games">Games</button>
        </div>
        <div id="tab-content"></div>
      </div>
    `;

    const bindTab = btn => btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeTab = btn.dataset.tab;
      loadLeagueTab(id, activeTab);
    });
    document.querySelectorAll('.tab').forEach(bindTab);

    const league = await loadLeagueHeader(id);
    if (!league) return;

    // The commissioner (and admins) get a Manage tab
    if (canManage(league)) {
      const tabs = document.getElementById('league-tabs');
      tabs.insertAdjacentHTML('beforeend', '<button class="tab" data-tab="manage">Manage</button>');
      bindTab(tabs.lastElementChild);
    } else if (activeTab === 'manage') {
      activeTab = 'standings';
    }
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === activeTab));
    await loadLeagueTab(id, activeTab);
  }

  function canManage(league) {
    return isAdmin() || league.created_by === getMe()?.id;
  }

  async function loadLeagueHeader(id) {
    try {
      const league = await api('GET', `/leagues/${id}`);
      const el = document.getElementById('league-header');
      if (!el) return null;
      const iRun = league.created_by === getMe()?.id;
      el.innerHTML = `
        <div class="flex items-center justify-between flex-wrap gap-2">
          <div class="flex items-center" style="gap:14px;flex-wrap:wrap;">
            <a href="/" data-link style="color:var(--text-3);font-size:13px;text-decoration:none;">← Leagues</a>
            <h2>${league.name}</h2>
            ${statusPill(league.status)}
            ${iRun ? '<span style="font-size:11px;color:var(--gold);">You run this league</span>' : ''}
          </div>
          <div class="flex gap-2">
            ${league.status === 'drafting' ? `<a href="/league/${id}/draft" data-link class="btn btn-primary">🎯 Enter Draft Room</a>` : ''}
            ${league.status === 'active' ? `<a href="/league/${id}/draft" data-link class="btn btn-ghost">View Draft</a>` : ''}
          </div>
        </div>
      `;
      return league;
    } catch (e) {
      toast(e.message, 'error');
      return null;
    }
  }

  async function loadLeagueTab(id, tab) {
    const el = document.getElementById('tab-content');
    el.innerHTML = `<div class="skeleton" style="height:200px;border-radius:var(--radius-lg);"></div>`;

    if (tab === 'standings') {
      try {
        const data = await api('GET', `/scores/standings/${id}`);
        renderStandings(data);
      } catch (e) { toast(e.message, 'error'); }
    } else if (tab === 'grid') {
      try {
        const data = await api('GET', `/scores/standings/${id}`);
        renderRosterGrid(data);
      } catch (e) { toast(e.message, 'error'); }
    } else if (tab === 'roster') {
      try {
        const me = getMe();
        const league = await api('GET', `/leagues/${id}`);
        const myMember = league.league_members?.find(m => m.user_id === me?.id);
        if (!myMember) { el.innerHTML = `<div class="empty-state"><div class="icon">👤</div><p>You are not a member of this league.</p></div>`; return; }
        const roster = await api('GET', `/scores/roster/${id}/${myMember.id}`);
        renderRoster(roster, { league, memberId: myMember.id });
      } catch (e) { toast(e.message, 'error'); }
    } else if (tab === 'games') {
      try {
        const league = await api('GET', `/leagues/${id}`);
        const games = await api('GET', `/scores/games?season=${league.season}`);
        renderGames(games);
      } catch (e) { toast(e.message, 'error'); }
    } else if (tab === 'manage') {
      try {
        const league = await api('GET', `/leagues/${id}`);
        if (canManage(league)) renderManageTab(league);
      } catch (e) { toast(e.message, 'error'); }
    }
  }

  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const medal = r => r === 1 ? '🥇' : r === 2 ? '🥈' : r === 3 ? '🥉' : r;

  function renderStandings(data) {
    const el = document.getElementById('tab-content');
    const { rounds, started, members } = data;
    const meId = getMe()?.id;
    if (!members.length) { el.innerHTML = `<div class="empty-state"><div class="icon">🏆</div><p>No members yet.</p></div>`; return; }
    const noPoints = members.every(m => m.total === 0);
    const hot = started.length ? started[started.length - 1] : null;
    const hotLeader = hot ? members.find(m => m.roundRank[hot] === 1) : null;

    el.innerHTML = `
      ${noPoints ? `<p style="font-size:12px;color:var(--text-3);margin-bottom:10px;">No points yet — standings update as playoff games are scored.</p>` : ''}
      ${hotLeader ? `<p style="font-size:12px;color:var(--text-2);margin-bottom:10px;">Top score in ${hot}: <b style="color:var(--gold);">${esc(hotLeader.display_name)}</b> (${fmt(hotLeader.byRound[hot])})</p>` : ''}
      <div class="card st-wrap" style="padding:0;">
        <table class="st-table">
          <thead><tr>
            <th class="l">#</th><th class="l">Member</th>
            ${rounds.map(r => `<th>${r === 'Superbowl' ? 'SB' : r.slice(0, 3)}</th>`).join('')}
            <th style="color:var(--gold);">Total</th><th>Behind</th><th>Alive</th>
          </tr></thead>
          <tbody>
            ${members.map(m => `
              <tr class="st-row${m.user_id === meId ? ' me' : ''}" data-m="${m.id}">
                <td class="l rank rank-${m.rank}">${medal(m.rank)}</td>
                <td class="l" style="font-weight:600;">${esc(m.display_name)}${m.user_id === meId ? ' <span style="font-size:10px;color:var(--gold);">YOU</span>' : ''}
                  ${m.bestPlayer ? `<span class="st-sub">Top: ${esc(m.bestPlayer.name)} (${fmt(m.bestPlayer.total)})</span>` : ''}</td>
                ${rounds.map(r => {
                  const started_ = started.includes(r);
                  return `<td class="${started_ && m.roundRank[r] === 1 ? 'st-best' : ''}" style="${started_ ? '' : 'color:var(--text-3)'}">${started_ ? fmt(m.byRound[r]) : '—'}${started_ ? `<span class="st-sub">#${m.roundRank[r]}</span>` : ''}</td>`;
                }).join('')}
                <td class="stat-num highlight" style="font-size:14px;">${fmt(m.total)}</td>
                <td style="color:var(--text-3);">${m.rank === 1 ? '—' : '−' + fmt(m.behind)}</td>
                <td style="color:${m.alive ? 'var(--text-2)' : 'var(--red)'};">${m.alive}/${m.roster.length || 14}</td>
              </tr>
              <tr class="st-detail" id="st-d-${m.id}" style="display:none;"><td colspan="${rounds.length + 5}"><div class="st-detail-in">${rosterTable(m, rounds)}</div></td></tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      <p style="font-size:11px;color:var(--text-3);margin-top:8px;">Click a member to see their roster. Small numbers show the member's rank for that round; gold = best score of the round. Alive = players whose team is still in the playoffs.</p>
    `;
    el.querySelectorAll('.st-row').forEach(row => row.addEventListener('click', () => {
      const d = document.getElementById('st-d-' + row.dataset.m);
      d.style.display = d.style.display === 'none' ? 'table-row' : 'none';
    }));
  }

  // One member's roster as a rounds table (shared by standings detail + All Rosters)
  function rosterTable(m, rounds) {
    if (!m.roster.length) return `<span style="font-size:12px;color:var(--text-3);">No picks yet.</span>`;
    const cell = v => v ? `<td>${fmt(v)}</td>` : `<td class="z">0</td>`;
    return `
      <table class="rg">
        <thead><tr><th class="l">Player</th>${rounds.map(r => `<th>${r === 'Superbowl' ? 'SB' : r.slice(0, 3)}</th>`).join('')}<th>Total</th></tr></thead>
        <tbody>
          ${m.roster.map(s => `
            <tr class="${s.eliminated ? 'dead' : ''}">
              <td class="l"><span class="tm-badge" style="border-color:${s.color || 'var(--border)'};">${esc(s.team || '—')}</span> <span class="nm">${esc(s.name)}</span>
                <span style="color:var(--text-3);font-size:10px;">${esc(s.position)}</span>
                ${s.eliminated ? `<span class="done-tag">OUT · ${esc(({ Wildcard: 'WC', Divisional: 'DIV', Conference: 'CONF', Superbowl: 'SB' })[s.eliminatedRound] || s.eliminatedRound || '')}</span>` : ''}
                ${s.out ? '<span style="font-size:9px;font-weight:700;color:var(--red);">INJ</span>' : ''}
                ${s.replaced.map(x => `<div style="font-size:10px;color:var(--text-3);">↳ replaced ${esc(x.name)} (kept ${fmt(x.total)})</div>`).join('')}</td>
              ${rounds.map(r => cell(s.scores[r])).join('')}
              <td style="font-weight:700;">${fmt(s.total)}</td>
            </tr>`).join('')}
        </tbody>
        <tfoot><tr><td class="l">TOTAL</td>${rounds.map(r => `<td>${fmt(m.byRound[r])}</td>`).join('')}<td style="color:var(--gold);">${fmt(m.total)}</td></tr></tfoot>
      </table>`;
  }

  function renderRosterGrid(data) {
    const el = document.getElementById('tab-content');
    const { rounds, members } = data;
    const meId = getMe()?.id;
    if (!members.length) { el.innerHTML = `<div class="empty-state"><div class="icon">📋</div><p>No members yet.</p></div>`; return; }
    el.innerHTML = `
      <div class="grid-cards">
        ${members.map(m => `
          <div class="card" style="${m.user_id === meId ? 'border-color:var(--gold-border);' : ''}">
            <div class="flex items-center justify-between mb-2">
              <h3>${medal(m.rank)} ${esc(m.display_name)}${m.user_id === meId ? ' <span style="font-size:10px;color:var(--gold);">YOU</span>' : ''}</h3>
              <span class="stat-num highlight">${fmt(m.total)}</span>
            </div>
            ${rosterTable(m, rounds)}
          </div>`).join('')}
      </div>
      <p style="font-size:11px;color:var(--text-3);margin-top:10px;">Struck-through players' teams are eliminated (tag shows the round they went out). Replaced players keep the points they earned.</p>

  function renderRoster(roster, ctx) {
    const el = document.getElementById('tab-content');
    const rounds = ['Wildcard', 'Divisional', 'Conference', 'Superbowl'];
    el.innerHTML = `
      <div class="card">
        <h3 class="mb-2">My Roster</h3>
        <p style="font-size:12px;color:var(--text-3);margin-bottom:10px;">Rosters are locked. If a player is ruled out before his team's next game, you can replace him with any undrafted player from the same team until kickoff.</p>
        ${roster.map(r => {
          const p = r.player;
          const t = r.team;
          return `
            <div class="roster-player-row">
              <div class="player-avatar">${p.name[0]}</div>
              <div style="flex:1;min-width:0;">
                <div style="font-weight:600;font-size:13px;">${p.name}</div>
                <div class="flex items-center gap-1 mt-1">

                  ${t ? `<span style="font-size:11px;color:var(--text-2);">${t.abbr}</span>` : ''}
                  ${t?.is_eliminated ? '<span style="font-size:10px;color:var(--red);">ELIMINATED</span>' : ''}
                  ${r.injury === 'out' ? '<span style="font-size:10px;font-weight:700;color:var(--red);">OUT</span>' : ''}
                </div>
                ${(r.replaced || []).map(x => `<div style="font-size:11px;color:var(--text-3);margin-top:2px;">Replaced ${x.name} (${x.position}) · kept ${fmt(x.total)} pts</div>`).join('')}
                ${r.swap?.canSwap ? `<div style="margin-top:6px;"><button class="btn btn-primary btn-sm" data-swap-out="${p.id}">Replace ${p.name.split(' ').pop()}</button>
                  <span style="font-size:11px;color:var(--text-3);">${r.swap.nextGame ? `before ${t.abbr}'s ${r.swap.nextGame.playoff_round} game` : 'admin test mode'}</span></div>` : ''}
              </div>
              <div class="flex" style="gap:0;flex:none;">
                ${rounds.map(round => `
                  <div style="text-align:center;width:50px;">
                    <div style="font-size:9px;color:var(--text-3);">${round.slice(0,3)}</div>
                    <div style="font-size:12px;font-weight:600;font-family:var(--font-mono);">${r.scores[round] != null ? fmt(r.scores[round]) : '—'}</div>
                  </div>
                `).join('')}
                <div style="text-align:center;width:58px;">
                  <div style="font-size:9px;color:var(--text-3);">Total</div>
                  <div style="font-size:13px;font-weight:700;color:var(--gold);font-family:var(--font-mono);">${fmt(r.total)}</div>
                </div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;

    el.querySelectorAll('[data-swap-out]').forEach(btn => {
      btn.addEventListener('click', () => openSwapModal(ctx, roster.find(r => r.player.id === btn.dataset.swapOut)));
    });
  }

  async function openSwapModal(ctx, row) {
    let options;
    try {
      const pool = await api('GET', `/players?season=${ctx.league.season}&leagueId=${ctx.league.id}&teamId=${row.team.id}`);
      options = pool.filter(p => !p.drafted && p.id !== row.player.id);
    } catch (e) { return toast(e.message, 'error'); }

    // Admins can test with a past game when the team has no upcoming one
    const needsGame = isAdmin() && !row.swap.nextGame;
    document.body.insertAdjacentHTML('beforeend', `
      <div id="modal-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;">
        <div class="card" style="width:100%;max-width:460px;max-height:80vh;display:flex;flex-direction:column;">
          <div class="flex items-center justify-between mb-2">
            <h3>Replace ${row.player.name}</h3>
            <button class="btn btn-ghost btn-sm" id="close-modal">✕</button>
          </div>
          <p style="font-size:12px;color:var(--text-2);margin-bottom:8px;">
            Undrafted ${row.team.abbr} players. ${row.player.name} keeps the points he already scored; your replacement scores from ${row.swap.nextGame ? `the ${row.swap.nextGame.playoff_round} game` : 'the game you pick below'} on.
          </p>
          ${needsGame ? `<select id="swap-game" style="margin-bottom:8px;">${(row.swap.teamGames || []).map(g => `<option value="${g.id}">Effective from: ${g.playoff_round} · ${g.game_date} (${g.status})</option>`).join('')}</select>` : ''}
          <div style="overflow-y:auto;flex:1;">
            ${options.length ? options.map(p => `
              <div class="draft-pick" style="margin-bottom:6px;">
                <div style="flex:1;min-width:0;">
                  <div style="font-size:13px;font-weight:600;">${p.name}</div>
                  <div class="flex items-center gap-1" style="margin-top:2px;">
                    <span class="${posClass(p.position)}">${p.position}</span>
                    ${p.overall_rank ? `<span style="font-size:11px;color:var(--text-3);">#${p.overall_rank} overall</span>` : ''}
                  </div>
                </div>
                ${p.reg_season_points != null ? `<div style="font-size:12px;color:var(--text-2);margin-right:8px;">${fmt(p.reg_season_points)} reg pts</div>` : ''}
                <button class="btn btn-primary btn-sm" data-swap-in="${p.id}">Pick</button>
              </div>`).join('') : '<p style="color:var(--text-2);font-size:13px;">No undrafted players left on this team.</p>'}
          </div>
        </div>
      </div>`);

    const overlay = document.getElementById('modal-overlay');
    document.getElementById('close-modal').addEventListener('click', () => overlay.remove());
    overlay.querySelectorAll('[data-swap-in]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const inP = options.find(p => p.id === btn.dataset.swapIn);
        if (!confirm(`Replace ${row.player.name} with ${inP.name}? This can't be undone.`)) return;
        try {
          await api('POST', `/leagues/${ctx.league.id}/swap`, {
            outPlayerId: row.player.id,
            inPlayerId: inP.id,
            memberId: ctx.memberId,
            effectiveGameId: needsGame ? document.getElementById('swap-game').value : undefined,
          });
          overlay.remove();
          toast(`${inP.name} added to your roster`, 'success');
          loadLeagueTab(ctx.league.id, 'roster');
        } catch (e) { toast(e.message, 'error'); }
      });
    });
  }

  function renderGames(games) {
    const el = document.getElementById('tab-content');
    const rounds = ['Wildcard', 'Divisional', 'Conference', 'Superbowl'];
    const grouped = {};
    for (const r of rounds) grouped[r] = games.filter(g => g.playoff_round === r);

    el.innerHTML = rounds.filter(r => grouped[r].length).map(r => `
      <div class="mb-3">
        <h3 class="mb-2">${r}</h3>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${grouped[r].map(g => `
            <div class="card" style="padding:0.75rem 1rem;">
              <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                  ${g.away_team ? `<span style="font-size:13px;font-weight:600;">${g.away_team.abbr}</span>` : '<span>TBD</span>'}
                  <span style="color:var(--text-3);font-size:12px;">vs</span>
                  ${g.home_team ? `<span style="font-size:13px;font-weight:600;">${g.home_team.abbr}</span>` : '<span>TBD</span>'}
                </div>
                ${g.status === 'FT'
                  ? `<span style="font-size:13px;font-family:var(--font-mono);font-weight:600;">${g.away_score} - ${g.home_score}</span>`
                  : `<span style="font-size:12px;color:var(--text-2);">${g.game_date || '—'} ${g.kickoff_time || ''}</span>`}
                <span class="${g.status === 'FT' ? 'pill pill-complete' : g.status === 'NS' ? 'pill pill-setup' : 'pill pill-live'}">${g.status}</span>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');
  }

  function renderManageTab(league) {
    const el = document.getElementById('tab-content');
    const members = league.league_members || [];
    const me = getMe();
    const iPlay = members.some(m => m.user_id === me?.id);
    const iCreated = league.created_by === me?.id;
    const open = league.status === 'setup' || isAdmin();   // roster of players locks once the draft starts
    const inviteUrl = `${location.origin}/join/${league.invite_code}`;

    el.innerHTML = `
      ${league.invite_code && league.status === 'setup' ? `
      <div class="admin-section">
        <div class="admin-section-header"><h3>Invite players</h3></div>
        <p style="font-size:13px;color:var(--text-2);margin-bottom:8px;">
          Send this link to ${Math.max(0, 7 - members.length)} more ${7 - members.length === 1 ? 'person' : 'people'}. They sign in (or create an account) and join automatically.
        </p>
        <div class="flex gap-2">
          <input type="text" id="invite-url" value="${inviteUrl}" readonly style="flex:1;" />
          <button class="btn btn-primary btn-sm" id="copy-invite-btn">Copy link</button>
        </div>
      </div>` : ''}
      <div class="admin-section">
        <div class="admin-section-header">
          <h3>Players <span style="font-size:13px;font-weight:500;color:${members.length === 7 ? 'var(--gold)' : 'var(--text-3)'};">${members.length} of 7</span></h3>
          ${open ? `<div class="flex gap-2">
            ${iCreated && !iPlay ? '<button class="btn btn-ghost btn-sm" id="join-self-btn">Play too</button>' : ''}
            <input type="email" id="add-member-email" placeholder="Add by email" style="width:200px;" />
            <button class="btn btn-primary btn-sm" id="add-member-btn">Add</button>
          </div>` : ''}
        </div>
        ${iCreated && !iPlay ? '<p style="font-size:12px;color:var(--text-3);margin-bottom:8px;">You are running this league without playing. You can still manage players and run the draft.</p>' : ''}
        <table class="admin-table">
          <thead><tr><th>Name</th><th>Draft Order</th><th></th></tr></thead>
          <tbody>
            ${members.length ? members.map(m => `
              <tr>
                <td>${m.display_name}${m.user_id === league.created_by ? ' <span style="font-size:10px;color:var(--gold);">COMMISSIONER</span>' : ''}</td>
                <td>${m.draft_order ?? '—'}</td>
                <td>${open ? `<button class="btn btn-danger btn-sm" data-remove-member="${m.id}">Remove</button>` : ''}</td>
              </tr>
            `).join('') : '<tr><td colspan="3" style="color:var(--text-3);">Nobody has joined yet.</td></tr>'}
          </tbody>
        </table>
      </div>
      <div class="admin-section">
        <div class="admin-section-header"><h3>${isAdmin() ? 'League Status' : 'Draft'}</h3></div>
        ${isAdmin() ? `
          <div class="flex gap-2 flex-wrap">
            ${['setup','drafting','active','complete'].map(s => `
              <button class="btn ${league.status === s ? 'btn-primary' : 'btn-ghost'} btn-sm" data-set-status="${s}">${s}</button>
            `).join('')}
          </div>` : league.status === 'setup' ? `
          <p style="font-size:13px;color:var(--text-2);margin-bottom:8px;">
            ${members.length === 7 ? 'All 7 players are in. Starting the draft locks the player list.' : `The draft can start once all 7 players have joined (${members.length} of 7 so far).`}
          </p>
          <button class="btn btn-primary" id="start-draft-btn" ${members.length === 7 ? '' : 'disabled'}>Start the draft</button>`
          : `<p style="font-size:13px;color:var(--text-2);">The draft has started. Use the draft room to run it.</p>`}
      </div>
      ${open ? `<div class="admin-section">
        <div class="admin-section-header">
          <h3>Draft Order</h3>
          <button class="btn btn-ghost btn-sm" id="randomize-order-btn">🎲 Randomize</button>
        </div>
        <p style="font-size:13px;color:var(--text-2);">Randomize sets a random snake draft order. If you skip this, the order is randomized when the draft starts.</p>
      </div>` : ''}
    `;

    document.getElementById('copy-invite-btn')?.addEventListener('click', async () => {
      const input = document.getElementById('invite-url');
      try { await navigator.clipboard.writeText(input.value); toast('Invite link copied', 'success'); }
      catch { input.select(); toast('Press Ctrl+C to copy the link'); }
    });

    document.getElementById('join-self-btn')?.addEventListener('click', async () => {
      try {
        await api('POST', `/leagues/${league.id}/members`, { email: me.email });
        toast("You're in as a player", 'success');
        loadLeagueTab(league.id, 'manage');
      } catch (e) { toast(e.message, 'error'); }
    });

    document.getElementById('start-draft-btn')?.addEventListener('click', async () => {
      if (!confirm('Start the draft? Players can no longer be added or removed.')) return;
      try {
        await api('PATCH', `/leagues/${league.id}`, { status: 'drafting' });
        navigate(`/league/${league.id}/draft`);
      } catch (e) { toast(e.message, 'error'); }
    });

    document.getElementById('add-member-btn')?.addEventListener('click', async () => {
      const email = document.getElementById('add-member-email').value.trim();
      if (!email) return;
      try {
        await api('POST', `/leagues/${league.id}/members`, { email });
        toast('Member added!', 'success');
        loadLeagueTab(league.id, 'manage');
      } catch (e) { toast(e.message, 'error'); }
    });

    el.querySelectorAll('[data-remove-member]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Remove this member?')) return;
        try {
          await api('DELETE', `/leagues/${league.id}/members/${btn.dataset.removeMember}`);
          loadLeagueTab(league.id, 'manage');
        } catch (e) { toast(e.message, 'error'); }
      });
    });

    el.querySelectorAll('[data-set-status]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const status = btn.dataset.setStatus;
        const count = (league.league_members || []).length;
        let force = false;
        if (status === 'drafting' && count !== 7) {
          if (!confirm(`Only ${count} of 7 members have joined. Start the draft anyway? (Use this for testing only.)`)) return;
          force = true;
        }
        try {
          await api('PATCH', `/leagues/${league.id}`, { status, force });
          toast('Status updated', 'success');
          loadLeagueHeader(league.id);
          loadLeagueTab(league.id, 'manage');
        } catch (e) { toast(e.message, 'error'); }
      });
    });

    document.getElementById('randomize-order-btn')?.addEventListener('click', async () => {
      if (!confirm('Randomize draft order?')) return;
      try {
        await api('POST', `/leagues/${league.id}/set-draft-order`);
        toast('Draft order randomized', 'success');
      } catch (e) { toast(e.message, 'error'); }
    });
  }

      seasonInput.addEventListener('change', () => loadTeamsList(seasonInput.value));
      loadTeamsList(seasonInput.value);

      document.getElementById('pull-teams-btn')?.addEventListener('click', async () => {
        const season = document.getElementById('admin-season').value;
        try {
          const r = await api('POST', '/players/pull-teams', { season: parseInt(season) });
          toast(`Imported ${r.imported} teams`, 'success');
          loadTeamsList(season);
        } catch (e) { toast(e.message, 'error'); }
      });

      document.getElementById('pull-players-btn')?.addEventListener('click', async () => {
        const season = document.getElementById('admin-season').value;
        try {
          toast('Pulling players… this may take a moment');
          const r = await api('POST', '/players/pull-players', { season: parseInt(season) });
          toast(`Imported ${r.imported} players`, 'success');
        } catch (e) { toast(e.message, 'error'); }
      });

      document.getElementById('confirm-all-btn')?.addEventListener('click', async () => {
        const season = document.getElementById('admin-season').value;
        if (!confirm(`Confirm all players for ${season}?`)) return;
        try {
          await api('POST', '/players/confirm-all', { season: parseInt(season) });
          toast('All players confirmed', 'success');
        } catch (e) { toast(e.message, 'error'); }
      });

    } else if (tab === 'games') {
      el.innerHTML = `
        <div class="admin-section">
          <div class="admin-section-header">
            <h3>Postseason Games</h3>
            <div class="flex gap-2 flex-wrap">
              <select id="g-season" style="width:90px;">${seasonOptions()}</select>
              <input type="text" id="g-start" placeholder="Start date YYYY-MM-DD" style="width:160px;" />
              <input type="text" id="g-end" placeholder="End date YYYY-MM-DD" style="width:160px;" />
              <button class="btn btn-ghost btn-sm" id="pull-games-btn">Pull Games</button>
            </div>
          </div>
          <div id="games-admin-list"></div>
        </div>
      `;

      const gSeason = document.getElementById('g-season');
      gSeason.addEventListener('change', () => loadAdminGames(gSeason.value));
      loadAdminGames(gSeason.value);

      document.getElementById('pull-games-btn')?.addEventListener('click', async () => {
        const season   = document.getElementById('g-season').value;
        const startDate = document.getElementById('g-start').value;
        const endDate   = document.getElementById('g-end').value;
        try {
          const r = await api('POST', '/scores/pull-games', { season: parseInt(season), startDate, endDate });
          toast(`Imported ${r.imported} games`, 'success');
          loadAdminGames(season);
        } catch (e) { toast(e.message, 'error'); }
      });

    } else if (tab === 'injuries') {
      el.innerHTML = `
        <div class="admin-section">
          <div class="admin-section-header">
            <h3>Injuries</h3>
            <div class="flex gap-2">
              <select id="inj-season" style="width:90px;">${seasonOptions()}</select>
              <input type="text" id="inj-search" placeholder="Search players…" style="width:200px;" />
            </div>
          </div>
          <p style="font-size:13px;color:var(--text-2);margin-bottom:1rem;">
            Mark a player OUT when he is ruled out before his team's next game. His owner can then replace him until kickoff.
            Don't use this for injuries during a game. Clear the flag after the game.
          </p>
          <div id="inj-list"></div>
        </div>`;

      let players = [];
      const render = () => {
        const q = document.getElementById('inj-search').value.trim().toLowerCase();
        const out = players.filter(p => p.injury_status === 'out');
        const matches = q ? players.filter(p => p.injury_status !== 'out' && p.name.toLowerCase().includes(q)).slice(0, 25) : [];
        const row = p => `
          <tr>
            <td>${p.name}</td><td>${p.position}</td><td>${p.nfl_teams?.abbr || ''}</td>
            <td><input type="checkbox" data-inj="${p.id}" ${p.injury_status === 'out' ? 'checked' : ''} /></td>
          </tr>`;
        document.getElementById('inj-list').innerHTML = `
          <h4 style="margin-bottom:6px;">Currently OUT (${out.length})</h4>
          ${out.length ? `<table class="admin-table"><thead><tr><th>Player</th><th>Pos</th><th>Team</th><th>Out</th></tr></thead><tbody>${out.map(row).join('')}</tbody></table>`
            : '<p style="color:var(--text-2);font-size:13px;">Nobody is marked out.</p>'}
          ${q ? `<h4 style="margin:1rem 0 6px;">Search results</h4>
            ${matches.length ? `<table class="admin-table"><thead><tr><th>Player</th><th>Pos</th><th>Team</th><th>Out</th></tr></thead><tbody>${matches.map(row).join('')}</tbody></table>`
              : '<p style="color:var(--text-2);font-size:13px;">No matching players.</p>'}` : ''}`;
        document.querySelectorAll('[data-inj]').forEach(cb => {
          cb.addEventListener('change', async () => {
            try {
              await api('POST', `/players/${cb.dataset.inj}/injury`, { status: cb.checked ? 'out' : null });
              const p = players.find(x => x.id === cb.dataset.inj);
              p.injury_status = cb.checked ? 'out' : null;
              render();
            } catch (e) { toast(e.message, 'error'); cb.checked = !cb.checked; }
          });
        });
      };

      const load = async () => {
        try {
          players = await api('GET', `/players?season=${document.getElementById('inj-season').value}`);
          render();
        } catch (e) { toast(e.message, 'error'); }
      };
      document.getElementById('inj-season').addEventListener('change', load);
      document.getElementById('inj-search').addEventListener('input', render);
      load();

    } else if (tab === 'scores') {
      el.innerHTML = `
        <div class="admin-section">
          <div class="admin-section-header"><h3>Manual Score Refresh</h3></div>
          <p style="font-size:13px;color:var(--text-2);margin-bottom:1rem;">Scores update automatically every minute during game windows. Use this to force a refresh.</p>
          <div id="refresh-games-list"></div>
        </div>
      `;
      loadRefreshGames();
    }
  }

  async function loadTeamsList(season) {
    const el = document.getElementById('teams-list');
    if (!el) return;
    try {
      const teams = await api('GET', `/players/teams?season=${season}`);
      if (!teams.length) { el.innerHTML = '<p style="color:var(--text-2);font-size:13px;">No teams pulled yet.</p>'; return; }
      el.innerHTML = `<table class="admin-table">
        <thead><tr><th>Team</th><th>Abbr</th><th>In Playoffs</th><th>Eliminated</th></tr></thead>
        <tbody>${teams.map(t => `
          <tr>
            <td>${t.name}</td>
            <td>${t.abbr}</td>
            <td><input type="checkbox" ${t.in_playoffs ? 'checked' : ''} data-team-id="${t.id}" data-field="in_playoffs" /></td>
            <td><input type="checkbox" ${t.is_eliminated ? 'checked' : ''} data-team-id="${t.id}" data-field="is_eliminated" /></td>
          </tr>
        `).join('')}</tbody>
      </table>`;

      el.querySelectorAll('input[data-team-id]').forEach(cb => {
        cb.addEventListener('change', async () => {
          try {
            await api('PATCH', `/players/teams/${cb.dataset.teamId}`, { [cb.dataset.field]: cb.checked });
          } catch (e) { toast(e.message, 'error'); cb.checked = !cb.checked; }
        });
      });
    } catch (e) { toast(e.message, 'error'); }
  }

  async function loadAdminGames(season) {
    const el = document.getElementById('games-admin-list');
    if (!el) return;
    try {
      const games = await api('GET', `/scores/games?season=${season}`);
      el.innerHTML = games.map(g => `
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;">
          <span style="font-weight:600;min-width:120px;">${g.playoff_round}</span>
          <span>${g.away_team?.abbr || '?'} vs ${g.home_team?.abbr || '?'}</span>
          <span style="color:var(--text-2);">${g.game_date}</span>
          <span>${g.status}</span>
          <button class="btn btn-ghost btn-sm" data-refresh-game="${g.id}">Refresh</button>
        </div>
      `).join('');

      el.querySelectorAll('[data-refresh-game]').forEach(btn => {
        btn.addEventListener('click', async () => {
          try {
            await api('POST', `/scores/refresh-game/${btn.dataset.refreshGame}`);
            toast('Stats refreshed', 'success');
          } catch (e) { toast(e.message, 'error'); }
        });
      });
    } catch (e) { toast(e.message, 'error'); }
  }

  async function loadRefreshGames() {
    const el = document.getElementById('refresh-games-list');
    if (!el) return;
    try {
      const games = await api('GET', '/scores/games');
      el.innerHTML = games.map(g => `
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;">
          <span style="font-weight:600;min-width:120px;">${g.playoff_round}</span>
          <span>${g.away_team?.abbr || '?'} vs ${g.home_team?.abbr || '?'}</span>
          <span style="color:var(--text-2);flex:1;">${g.game_date} · ${g.status}</span>
          <button class="btn btn-ghost btn-sm" data-refresh-game="${g.id}">↻ Refresh</button>
        </div>
      `).join('');

      el.querySelectorAll('[data-refresh-game]').forEach(btn => {
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          try {
            await api('POST', `/scores/refresh-game/${btn.dataset.refreshGame}`);
            toast('Stats refreshed', 'success');
          } catch (e) { toast(e.message, 'error'); }
          btn.disabled = false;
        });
      });
    } catch (e) { toast(e.message, 'error'); }
  }

  // ── Navbar ──
  function navbar() {
    return `
      <nav class="navbar">
        <a class="navbar-brand" href="/" data-link>
          <div class="navbar-logo">🏈</div>
          <span class="navbar-title">Playoff <span>Fantasy</span></span>
        </a>
        <div class="navbar-right">
          <a href="/live" data-link class="nav-link">Live</a>
          <a href="/admin" data-link class="nav-link" id="nav-admin-link" style="display:${isAdmin() ? 'inline-flex' : 'none'};">Admin</a>
          <span class="nav-link" id="nav-user">${getMe()?.email?.split('@')[0] || ''}</span>
          <button class="btn btn-ghost btn-sm" onclick="app.openTheme()" title="Theme">🎨</button>
          <button class="btn btn-ghost btn-sm" onclick="app.signOut()">Sign out</button>
        </div>
      </nav>
    `;
  }

  // ── Boot ──
  init();
</script>
</body>
</html>
